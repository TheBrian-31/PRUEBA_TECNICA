spring:
  application:
    name: coworking
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  cache:
    type: simple
    cache-names: occupancy

info:
  app:
    name: coworking
    description: "Prueba Técnica: API de reservas de espacios de coworking"
    version: 0.0.1

security:
  jwt:
    expiration: 1h

payment:
  validation:
    url: http://localhost:8080/internal/payments/validate
    timeout: 3s
    delay: 0s
    force-failure: false # force-failure: false or true, para simular que un pago falla o sirve

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      payment:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      payment:
        timeout-duration: 2s
        cancel-running-future: true
