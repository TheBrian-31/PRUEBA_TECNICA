spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

security:
  jwt:
    secret: ${JWT_SECRET}

payment:
  validation:
    url: ${PAYMENT_VALIDATION_URL}
    delay: 0s
    force-failure: false

management:
  endpoint:
    health:
      show-details: when_authorized
